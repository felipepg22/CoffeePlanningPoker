services:
  - type: web
    name: coffee-planning-poker-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist/coffee-planning-poker/browser
    envVars:
      - key: ROOM_HUB_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
